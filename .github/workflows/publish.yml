name: Publish Vuetify to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified package on npm for maintainer approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    # Playwright 1.56.1 provides Chromium and system dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version and select npm dist-tag
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern="^$number\\.$number\\.$number(-$identifier(\\.$identifier)*)?$"
          if [[ ! "$version" =~ $pattern || "$version" == 0.0.0 ]]; then
            printf '::error::Invalid package.json release version %s\n' "$version"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Release tag %s does not match package.json version %s\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            dist_tag=pre-release
          fi
          printf 'dist-tag=%s\n' "$dist_tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Build, pack and inspect Vuetify
        env:
          PACK_DIR: ${{ runner.temp }}/vuetify-pack
        run: |
          mkdir -p "$PACK_DIR"
          npm run build
          npm pack ./dist/package --offline --ignore-scripts --json --pack-destination "$PACK_DIR" > "$PACK_DIR/pack.json"
          node scripts/check-package.mjs "$PACK_DIR/pack.json"
          mv "$PACK_DIR"/uninterface-backend-vuetify-*.tgz "$PACK_DIR/backend-vuetify.tgz"
      - name: Verify a fresh consumer in development and production
        env:
          PACK_DIR: ${{ runner.temp }}/vuetify-pack
          CONSUMER_DIR: ${{ runner.temp }}/vuetify-consumer
        run: |
          core_version=$(node -p 'require("./package.json").devDependencies["@uninterface/uninterface"]')
          mkdir -p "$CONSUMER_DIR"
          cp -R tests/package-consumer/. "$CONSUMER_DIR/"
          cp "$PACK_DIR/backend-vuetify.tgz" "$CONSUMER_DIR/"
          cd "$CONSUMER_DIR"
          npm pkg set "dependencies.@uninterface/uninterface=$core_version"
          npm install --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
          npm ls @uninterface/uninterface vue --all
          npm run check
          node --input-type=module -e 'await import("@uninterface/backend/testing"); await import("@uninterface/backend/testing/dom")'
          npx playwright install --with-deps chromium
          npm test
      - name: Build the consumer without the optional Testing peer
        working-directory: ${{ runner.temp }}/vuetify-consumer
        run: |
          npm uninstall @uninterface/testing --ignore-scripts --no-audit --no-fund
          test ! -d node_modules/@uninterface/testing
          npm exec -- vite build
      - name: Rehearse publication and record integrity
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        working-directory: ${{ runner.temp }}/vuetify-pack
        run: |
          npm publish ./backend-vuetify.tgz --dry-run --offline --ignore-scripts --access public --tag "$NPM_DIST_TAG"
          sha512sum backend-vuetify.tgz > SHA512SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uninterface-backend-vuetify-npm-package
          path: ${{ runner.temp }}/vuetify-pack/
          if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' || inputs.stage }}
    needs: package
    env:
      NPM_DIST_TAG: ${{ needs.package.outputs.dist-tag }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: uninterface-backend-vuetify-npm-package
          path: ${{ runner.temp }}/vuetify-pack
      - name: Verify the release tarball
        working-directory: ${{ runner.temp }}/vuetify-pack
        run: sha512sum --check SHA512SUMS
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
      - name: Publish the verified tarball to npm
        if: ${{ github.event_name == 'push' }}
        working-directory: ${{ runner.temp }}/vuetify-pack
        run: npm publish ./backend-vuetify.tgz --ignore-scripts --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org/
      - name: Stage the verified tarball on npm
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ runner.temp }}/vuetify-pack
        run: npm stage publish ./backend-vuetify.tgz --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org/
